<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORQ Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #000000;
      --surface:   #0d0d0d;
      --border:    #1c1c1c;
      --border-hi: #333333;
      --text:      #ffffff;
      --muted:     #555555;
      --dim:       #888888;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 3rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .logo span { color: var(--muted); }

    .header-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .dot.ready   { background: #fff; }
    .dot.running { background: #fff; animation: blink 1.1s ease-in-out infinite; }
    .dot.done    { background: #fff; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── Main ── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 5rem 2rem 6rem;
    }

    /* ── Hero ── */
    .hero { margin-bottom: 3.5rem; }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.6rem;
    }

    .hero-sub {
      font-size: 0.85rem;
      color: var(--dim);
      letter-spacing: 0.02em;
    }

    /* ── Input ── */
    .input-block { position: relative; }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.95rem;
      line-height: 1.65;
      padding: 1.25rem 1.5rem;
      min-height: 130px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      display: block;
      width: 100%;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--border-hi); }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.85rem;
    }

    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    .hint kbd {
      border: 1px solid var(--border-hi);
      padding: 0.1rem 0.35rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--dim);
    }

    button#analyzeBtn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.65rem 1.75rem;
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    button#analyzeBtn:hover:not(:disabled) { opacity: 0.82; }
    button#analyzeBtn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3.5rem 0;
    }

    /* ── Stages ── */
    .stages { display: flex; flex-direction: column; }

    .stage {
      padding: 2.25rem 0;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.4s ease;
    }

    .stage:last-child { border-bottom: none; }

    .stage.idle     { opacity: 0.25; }
    .stage.active   { opacity: 1; }
    .stage.complete { opacity: 1; }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 0;
      cursor: default;
    }

    .stage-num {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      width: 20px;
      flex-shrink: 0;
    }

    .stage-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .stage-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid var(--muted);
      flex-shrink: 0;
    }

    .stage.active  .badge-dot { background: #fff; border-color: #fff; animation: blink 1.1s ease-in-out infinite; }
    .stage.active  .stage-badge { color: var(--dim); }
    .stage.complete .badge-dot { background: #fff; border-color: #fff; }
    .stage.complete .stage-badge { color: var(--dim); }

    /* ── Stage Content ── */
    .stage-body {
      display: none;
      padding-left: 45px;
      padding-top: 1.5rem;
      animation: fadeUp 0.4s ease forwards;
    }

    .stage.complete .stage-body { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .stage-body p           { margin-bottom: 0.75rem; color: #bbb; font-size: 0.9rem; }
    .stage-body p:last-child { margin-bottom: 0; }
    .stage-body ul, .stage-body ol { padding-left: 1.35rem; margin-bottom: 0.75rem; color: #bbb; font-size: 0.9rem; }
    .stage-body li          { margin-bottom: 0.3rem; }
    .stage-body strong      { color: #fff; font-weight: 500; }
    .stage-body h1, .stage-body h2, .stage-body h3 {
      color: #fff;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 1.25rem 0 0.5rem;
    }
    .stage-body code {
      font-family: var(--mono);
      font-size: 0.82rem;
      background: #111;
      padding: 0.15rem 0.35rem;
      color: #ddd;
    }
    .stage-body blockquote {
      border-left: 2px solid var(--border-hi);
      padding-left: 1rem;
      color: var(--dim);
      font-style: italic;
      margin: 0.75rem 0;
    }

    /* ── Loading skeleton ── */
    .skeleton {
      display: none;
      padding-left: 45px;
      padding-top: 1.5rem;
      gap: 0.5rem;
      flex-direction: column;
    }

    .stage.active .skeleton { display: flex; }
    .stage.complete .skeleton { display: none; }

    .skel-line {
      height: 10px;
      background: linear-gradient(90deg, #111 25%, #1c1c1c 50%, #111 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }

    .skel-line.w-full  { width: 100%; }
    .skel-line.w-80    { width: 80%; }
    .skel-line.w-60    { width: 60%; }
    .skel-line.w-90    { width: 90%; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Error state ── */
    .error-banner {
      display: none;
      margin-top: 2rem;
      padding: 1rem 1.25rem;
      border: 1px solid #333;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: #ff6b6b;
    }

    /* ── Export bar ── */
    .export-bar {
      display: none;
      margin-top: 3rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border-hi);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .export-bar.visible { display: flex; }

    .export-label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .export-buttons { display: flex; gap: 0.75rem; }

    .export-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-hi);
      padding: 0.5rem 1.25rem;
      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .export-btn:hover { background: var(--text); color: var(--bg); }
    .export-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer span {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header, footer { padding: 0 1.25rem; }
      main { padding: 3rem 1.25rem 5rem; }
      h1 { font-size: 1.75rem; }
      .stage-body { padding-left: 0; }
      .skeleton   { padding-left: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ORQ <span>/</span> Agent</div>
  <div class="header-status">
    <div class="dot ready" id="globalDot"></div>
    <span id="globalLabel">Ready</span>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Analyze any problem.</h1>
    <p class="hero-sub">Multi-agent reasoning — Problem · Options · Risks · Recommendation</p>
  </div>

  <div class="input-block">
    <textarea id="queryInput" placeholder="Describe the problem you want to analyze…" rows="5"></textarea>
    <div class="input-footer">
      <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</span>
      <button id="analyzeBtn" onclick="runAnalysis()">Analyze →</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <hr class="divider" id="resultsDivider" style="display:none" />

  <div class="stages" id="stagesContainer" style="display:none"></div>

  <div class="export-bar" id="exportBar">
    <span class="export-label">Executive Brief ready</span>
    <div class="export-buttons">
      <button class="export-btn" id="pdfBtn" onclick="downloadExport('pdf')">↓ Download PDF</button>
      <button class="export-btn" id="docxBtn" onclick="downloadExport('docx')">↓ Download Word</button>
    </div>
  </div>
</main>

<footer>
  <span>ORQ AGENT · CLAUDE OPUS</span>
  <span id="footerTimer"></span>
</footer>

<script>
  const STAGES = [
    { id: 'problem',        num: '01', label: 'Problem Analysis' },
    { id: 'options',        num: '02', label: 'Options'          },
    { id: 'risks',          num: '03', label: 'Risks'            },
    { id: 'recommendation', num: '04', label: 'Recommendation'   },
  ];

  let timerInterval = null;
  let startTime = null;
  let currentQuery = '';
  const results = { problem: '', options: '', risks: '', recommendation: '' };

  marked.setOptions({ breaks: true, gfm: true });

  function buildStages() {
    const container = document.getElementById('stagesContainer');
    container.innerHTML = STAGES.map(s => `
      <div class="stage idle" id="stage-${s.id}">
        <div class="stage-header">
          <span class="stage-num">${s.num}</span>
          <span class="stage-title">${s.label}</span>
          <div class="stage-badge">
            <div class="badge-dot"></div>
            <span id="badge-label-${s.id}">Waiting</span>
          </div>
        </div>
        <div class="skeleton">
          <div class="skel-line w-full"></div>
          <div class="skel-line w-90"></div>
          <div class="skel-line w-80"></div>
          <div class="skel-line w-60"></div>
        </div>
        <div class="stage-body" id="body-${s.id}"></div>
      </div>
    `).join('');
  }

  function setStageState(id, state) {
    const el = document.getElementById(`stage-${id}`);
    const label = document.getElementById(`badge-label-${id}`);
    el.className = `stage ${state}`;
    label.textContent = state === 'active' ? 'Running' : state === 'complete' ? 'Complete' : 'Waiting';
  }

  function setStatus(text, mode) {
    document.getElementById('globalLabel').textContent = text;
    const dot = document.getElementById('globalDot');
    dot.className = `dot ${mode}`;
  }

  function startTimer() {
    startTime = Date.now();
    const el = document.getElementById('footerTimer');
    timerInterval = setInterval(() => {
      const s = ((Date.now() - startTime) / 1000).toFixed(1);
      el.textContent = `${s}s elapsed`;
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    const s = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('footerTimer').textContent = `Completed in ${s}s`;
  }

  async function runAnalysis() {
    const query = document.getElementById('queryInput').value.trim();
    if (!query) return;
    currentQuery = query;
    results.problem = results.options = results.risks = results.recommendation = '';
    document.getElementById('exportBar').classList.remove('visible');

    const btn = document.getElementById('analyzeBtn');
    const errorBanner = document.getElementById('errorBanner');

    btn.disabled = true;
    btn.textContent = 'Running…';
    errorBanner.style.display = 'none';

    document.getElementById('resultsDivider').style.display = 'block';
    const container = document.getElementById('stagesContainer');
    container.style.display = 'flex';
    buildStages();
    setStatus('Running', 'running');
    startTimer();

    try {
      const response = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            handleEvent(data);
          } catch {}
        }
      }
    } catch (err) {
      errorBanner.textContent = `Error: ${err.message}`;
      errorBanner.style.display = 'block';
      setStatus('Error', 'idle');
      stopTimer();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Analyze →';
    }
  }

  function handleEvent(data) {
    if (data.event === 'stage_start') {
      setStageState(data.stage, 'active');
      document.getElementById(`stage-${data.stage}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    } else if (data.event === 'stage_complete') {
      setStageState(data.stage, 'complete');
      document.getElementById(`body-${data.stage}`).innerHTML = marked.parse(data.content || '');
      if (data.stage in results) results[data.stage] = data.content || '';

    } else if (data.event === 'done') {
      setStatus('Complete', 'done');
      stopTimer();
      document.getElementById('exportBar').classList.add('visible');

    } else if (data.event === 'error') {
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.textContent = `Agent error: ${data.message}`;
      errorBanner.style.display = 'block';
      setStatus('Error', 'idle');
      stopTimer();
    }
  }

  async function downloadExport(format) {
    const btn = document.getElementById(format === 'pdf' ? 'pdfBtn' : 'docxBtn');
    btn.disabled = true;
    btn.textContent = 'Generating…';

    try {
      const response = await fetch(`/export/${format}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: currentQuery, ...results }),
      });

      if (!response.ok) throw new Error('Export failed');

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `executive-brief.${format === 'pdf' ? 'pdf' : 'docx'}`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert(`Export error: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = format === 'pdf' ? '↓ Download PDF' : '↓ Download Word';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('queryInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runAnalysis();
    });
  });
</script>
</body>
</html>
